<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <!-- Estilo Externo -->
    <link rel="stylesheet" href="style.css?v=1.0">
    <!-- SDK Oficial Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="telaLogin" class="login-card">
            <h2>Entrar no Sistema</h2>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" required>
            </div>
            <button class="btn-primary" onclick="executarLogin()">Entrar</button>
        </div>

        <!-- APP PRINCIPAL -->
        <div id="appContainer" style="display: none;">
            <div class="header">
                <h2>Painel Financeiro</h2>
                <div>
                    <span id="userDisplayTag"></span>
                    <button class="btn-secondary" onclick="deslogar()">Sair</button>
                </div>
            </div>

            <!-- CARROSSEL DE MESES -->
            <div id="tabsMeses" class="tabs-container"></div>

            <!-- DASHBOARD -->
            <div class="dashboard">
                <div class="card">
                    <h4>Entradas</h4>
                    <p id="dashEntradas" class="txt-success">R$ 0,00</p>
                </div>
                <div class="card">
                    <h4>Saídas</h4>
                    <p id="dashSaidas" class="txt-danger">R$ 0,00</p>
                </div>
                <div class="card">
                    <h4>Saldo do Mês</h4>
                    <p id="dashSaldo">R$ 0,00</p>
                </div>
            </div>

            <!-- FORMULÁRIO DE CADASTRO -->
            <div class="form-card">
                <h3>Cadastrar Movimentação</h3>
                <form id="formCadastro" onsubmit="salvarLancamento(event)">
                    <div class="row">
                        <button type="button" id="btnSaida" class="btn-tipo active" onclick="selecionarTipo('saida')">🔴 Saída / Despesa</button>
                        <button type="button" id="btnEntrada" class="btn-tipo" onclick="selecionarTipo('entrada')">🟢 Entrada / Receita</button>
                    </div>

                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="cadDescricao" placeholder="Ex: Tio Léo, Mercado, Aluguel" required>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label>Categoria</label>
                            <select id="cadCategoria">
                                <option value="Transporte">Transporte</option>
                                <option value="Moradia">Moradia</option>
                                <option value="Alimentação">Alimentação</option>
                                <option value="Lazer">Lazer</option>
                                <option value="Rendimento">Rendimento</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="col">
                            <label>Vencimento</label>
                            <input type="date" id="cadVencimento" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Tipo de Lançamento</label>
                        <select id="cadRecorrencia" onchange="alternarCampoParcelas()">
                            <option value="unico">Único (Apenas este mês)</option>
                            <option value="fixo">Fixo (Repete todo mês)</option>
                            <option value="parcelado">Parcelado (Dividido em meses)</option>
                        </select>
                    </div>

                    <div id="boxParcelas" class="form-group" style="display: none;">
                        <label>Número de Parcelas</label>
                        <input type="number" id="cadTotalParcelas" min="2" max="72" value="2">
                    </div>

                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="cadValor" step="0.01" placeholder="0,00" required>
                    </div>

                    <button type="submit" class="btn-primary full-width">Salvar Lançamento</button>
                </form>
            </div>

            <!-- TABELA -->
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Vencimento</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo"></tbody>
            </table>
        </div>
    </div>

    <!-- Script com parâmetro de versão contra cache -->
    <script src="app.js?v=1.0"></script>
</body>
</html>
