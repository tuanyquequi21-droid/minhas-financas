<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginSection" class="login-card">
        <h2>Entrar no Sistema</h2>
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" id="loginUsername" placeholder="Digite seu usuário (ex: tuany)" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="loginSenha" placeholder="******" required>
        </div>
        <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
    </div>

    <!-- ÁREA AUTENTICADA -->
    <div id="appSection" style="display: none;">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>💰 Financeiro</h3>
                <button class="btn-close-menu" onclick="toggleMenu()">✕</button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" onclick="navegarPara('dashboard')">📊 Visão Geral & Calendário</button>
                <button class="nav-item" onclick="navegarPara('novoLancamento')">➕ Novo Lançamento</button>
                <button class="nav-item" onclick="navegarPara('historico')">📋 Extrato / Registros</button>
            </nav>
        </aside>

        <div id="sidebarOverlay" class="overlay" onclick="toggleMenu()"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="main-content">
            
            <header class="header">
                <button class="btn-menu" onclick="toggleMenu()">☰ Menu</button>
                <div class="header-right">
                    <button class="btn-secondary" onclick="alternarTema()" id="btnTema">🌙 Escuro</button>
                    <span id="userDisplayTag" class="user-badge"></span>
                    <button class="btn-secondary btn-logout" onclick="deslogar()">Sair</button>
                </div>
            </header>

            <!-- ABA 1: DASHBOARD & CALENDÁRIO -->
            <section id="pageDashboard" class="page-content active">
                <div class="dashboard-cards">
                    <div class="card">
                        <h4>Entradas</h4>
                        <p id="totalEntradas" class="txt-success">R$ 0,00</p>
                    </div>
                    <div class="card">
                        <h4>Saídas</h4>
                        <p id="totalSaidas" class="txt-danger">R$ 0,00</p>
                    </div>
                    <div class="card">
                        <h4>Saldo Total</h4>
                        <p id="saldoTotal">R$ 0,00</p>
                    </div>
                </div>

                <div class="grid-2-col">
                    <div class="card-box">
                        <h3>Resumo por Categoria</h3>
                        <div class="chart-container">
                            <canvas id="meuGrafico"></canvas>
                        </div>
                    </div>

                    <div class="card-box">
                        <div class="cal-header">
                            <button class="btn-secondary" onclick="mudarMesCalendario(-1)">❮</button>
                            <h3 id="calTituloMes">Mês Ano</h3>
                            <button class="btn-secondary" onclick="mudarMesCalendario(1)">❯</button>
                        </div>
                        <div class="calendar-grid-header">
                            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                        </div>
                        <div id="calendarDays" class="calendar-grid"></div>
                    </div>
                </div>
            </section>

            <!-- ABA 2: NOVO LANÇAMENTO -->
            <section id="pageNovoLancamento" class="page-content">
                <div class="form-card">
                    <h2>Cadastrar Transação</h2>
                    <form id="formTransacao" onsubmit="salvarTransacao(event)">
                        <div class="row">
                            <button type="button" id="btnEntrada" class="btn-tipo active" onclick="selecionarTipo('entrada')">➕ Entrada</button>
                            <button type="button" id="btnSaida" class="btn-tipo" onclick="selecionarTipo('saida')">➖ Saída</button>
                        </div>

                        <div class="form-group">
                            <label>Descrição</label>
                            <input type="text" id="desc" placeholder="Ex: Mercado, TV, Salário..." required>
                        </div>

                        <div class="row">
                            <div class="col">
                                <label>Valor (R$)</label>
                                <input type="number" step="0.01" id="valor" placeholder="0.00" required>
                            </div>
                            <div class="col">
                                <label>Data Inicial / Vencimento</label>
                                <input type="date" id="data" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <label>Categoria</label>
                                <select id="categoria" required>
                                    <option value="Alimentação">Alimentação</option>
                                    <option value="Moradia">Moradia</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Lazer">Lazer</option>
                                    <option value="Salário">Salário</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            
                            <div class="col">
                                <label>Em conjunto com (Usuário)</label>
                                <input type="text" id="userInputTarget" placeholder="Ex: joao (opcional)">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <label>Tipo de Cobrança</label>
                                <select id="recorrencia" onchange="alternarCamposParcela()">
                                    <option value="unico">Único (À vista)</option>
                                    <option value="fixo">Fixo (Mensal)</option>
                                    <option value="parcelado">Parcelado</option>
                                </select>
                            </div>
                            <div class="col" id="boxParcelas" style="display: none;">
                                <label>Nº de Parcelas</label>
                                <input type="number" id="totalParcelas" min="2" max="72" value="2">
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">Salvar Lançamento</button>
                    </form>
                </div>
            </section>

            <!-- ABA 3: HISTÓRICO DE REGISTROS (ORGANIZADO POR MÊS) -->
            <section id="pageHistorico" class="page-content">
                <div class="card-box">
                    <div class="header-table">
                        <h2>Registros Financeiros</h2>
                        <div class="filter-month">
                            <label for="filtroMes">Selecione o Mês: </label>
                            <select id="filtroMes" onchange="renderizarDados()" style="width: auto; display: inline-block; padding: 5px 10px;"></select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Categoria</th>
                                    <th>Tipo</th>
                                    <th>Valor</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaRegistros"></tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modalEdicao" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Editar Lançamento</h3>
                <button class="btn-close-menu" onclick="fecharModalEdicao()">✕</button>
            </div>
            <form id="formEditarTransacao" onsubmit="salvarEdicaoTransacao(event)">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="editDesc" required>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Valor (R$)</label>
                        <input type="number" step="0.01" id="editValor" required>
                    </div>
                    <div class="col">
                        <label>Data</label>
                        <input type="date" id="editData" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Categoria</label>
                        <select id="editCategoria" required>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Moradia">Moradia</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Salário">Salário</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Status</label>
                        <select id="editStatus">
                            <option value="pendente">Pendente ⏳</option>
                            <option value="quitado">Quitado / Pago ✅</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="fecharModalEdicao()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
